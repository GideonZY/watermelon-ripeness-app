name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Read Gradle version
        id: gradle_version
        shell: bash
        run: |
          GRADLE_VERSION=$(grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties \
            | sed -E 's#.*gradle-([0-9.]+)-(bin|all)\.zip#\1#')

          echo "Gradle version: $GRADLE_VERSION"

          if [ -z "$GRADLE_VERSION" ]; then
            echo "ERROR: 无法从 gradle-wrapper.properties 获取 Gradle 版本"
            cat gradle/wrapper/gradle-wrapper.properties
            exit 1
          fi

          echo "version=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle_version.outputs.version }}

      - name: Show Gradle version
        run: gradle --version

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "生成的 APK："
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: watermelon-ripeness-app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
